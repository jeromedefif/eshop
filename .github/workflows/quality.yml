name: Code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PostgreSQL 17 tests, TypeScript and ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: beginy_audit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d beginy_audit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/beginy_audit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node scripts/setup-test-db.mjs
      - name: Test checkout, account isolation, permissions and delivery
        run: npm run test
      - name: Check Next.js types
        run: npm run typecheck
      - name: Check lint
        if: ${{ !cancelled() }}
        run: npm run lint:ci
